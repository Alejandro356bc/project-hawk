[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quorum"
version = "0.1.0"
description = "Multi-LLM panel debates for coding tasks - discuss, vote, and synthesize."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["llm", "multi-agent", "debate", "coding-assistant", "openrouter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai",
    "python-dotenv",
    "rich",
    "pydantic",
    "textual",
]

[project.optional-dependencies]
dev = [
    "detect-secrets>=1.5,<2",
    "pytest",
    "pytest-asyncio",
    "mypy",
    "pre-commit>=4,<5",
    "ruff",
]

[project.scripts]
quorum = "quorum.main:cli_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # long strings / tool schemas; tighten incrementally

[tool.mypy]
strict = true
ignore_missing_imports = true
